<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06111f">
<title>OPERAÇÃO NEXUS // SCANNER</title>
<script src="https://unpkg.com/html5-qrcode" defer></script>
<style>
:root{--bg:#030914;--panel:#071525;--cyan:#32d9ff;--text:#e8f7ff;--muted:#82a8b8;--danger:#ff5f7d;--ok:#47f0b1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 50% 20%,rgba(18,119,164,.18),transparent 34%),linear-gradient(rgba(40,150,190,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(40,150,190,.035) 1px,transparent 1px),var(--bg);background-size:auto,32px 32px,32px 32px,auto;display:flex;justify-content:center}
.app{width:min(720px,100%);padding:20px 16px 28px}
header{text-align:center;margin-bottom:16px}.logo{width:min(92%,560px);max-height:170px;object-fit:contain;filter:drop-shadow(0 0 18px rgba(30,198,255,.16))}
.eyebrow{font-size:11px;letter-spacing:3px;color:var(--muted);margin:2px 0 7px}h1{font-size:24px;letter-spacing:5px;margin:0;font-weight:700}.sub{font-size:10px;letter-spacing:2px;color:var(--cyan);margin-top:8px}
.scanner-panel{border:1px solid rgba(50,217,255,.42);background:rgba(7,21,37,.86);padding:12px;box-shadow:0 0 30px rgba(0,170,230,.08),inset 0 0 28px rgba(0,140,190,.04);position:relative}
.scanner-panel:before,.scanner-panel:after{content:"";position:absolute;width:42px;height:42px;pointer-events:none}.scanner-panel:before{left:-1px;top:-1px;border-left:3px solid var(--cyan);border-top:3px solid var(--cyan)}.scanner-panel:after{right:-1px;bottom:-1px;border-right:3px solid var(--cyan);border-bottom:3px solid var(--cyan)}
#reader{width:100%;min-height:280px;background:#000;overflow:hidden}#reader video{width:100%!important;height:auto!important;object-fit:cover}
.status{text-align:center;padding:14px 8px 8px}.status-title{font-size:15px;letter-spacing:2px;font-weight:700}.status-text{font-size:12px;color:var(--muted);margin-top:6px}.error{color:var(--danger)}
.controls{display:grid;gap:10px;margin-top:12px}
button,select{width:100%;border:1px solid var(--cyan);background:rgba(15,99,132,.18);color:var(--text);padding:13px 16px;font-size:12px;font-weight:700;letter-spacing:2px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
select{letter-spacing:0;background:#071525}
select option{background:#071525;color:#fff}
.result{display:none;margin-top:14px;border:1px solid rgba(71,240,177,.55);padding:18px;text-align:center;background:rgba(12,50,43,.25)}.result.show{display:block}.ok{font-size:16px;letter-spacing:3px;font-weight:800}.code{font-size:24px;letter-spacing:3px;margin:12px 0}.small{font-size:10px;color:var(--muted);letter-spacing:2px}.result-label{font-size:10px;color:var(--muted);letter-spacing:3px;margin-top:14px}.word{font-size:34px;line-height:1.08;letter-spacing:4px;font-weight:900;margin:8px 0 12px;color:var(--cyan);text-shadow:0 0 18px rgba(50,217,255,.18)}.keyword{font-size:11px;color:var(--ok);letter-spacing:3px;font-weight:800;margin-top:16px}.evidence-log{display:none;margin-top:14px;border:1px solid rgba(50,217,255,.28);padding:14px;background:rgba(7,21,37,.55)}.evidence-log.show{display:block}.log-title{font-size:10px;color:var(--cyan);letter-spacing:2px;font-weight:800;margin-bottom:10px}.log-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;text-align:left}.log-item{font-size:11px;color:var(--text);padding:7px 8px;border:1px solid rgba(130,168,184,.18);background:rgba(255,255,255,.02)}.log-item span{color:var(--muted);margin-right:6px}.result .again{margin-top:14px}
.footer{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:10px;color:var(--muted);letter-spacing:1px}.counter{color:var(--cyan)}
@media(max-width:480px){.app{padding:12px 10px 22px}.logo{max-height:125px}h1{font-size:19px}#reader{min-height:250px}}
</style>
</head>
<body>
<main class="app">
<header>
<img class="logo" src="logo-nexus.png" alt="Operação NEXUS">
<div class="eyebrow">SISTEMA DE IDENTIFICAÇÃO</div>
<h1>SCANNER</h1>
<div class="sub">ACESSO RESTRITO // NEXUS</div>
</header>

<section class="scanner-panel">
<div id="reader"></div>
<div class="status">
<div class="status-title" id="statusTitle">AGUARDANDO ATIVAÇÃO</div>
<div class="status-text" id="statusText">Selecione a câmera e inicie o scanner.</div>
</div>
</section>

<div class="controls">
<select id="cameraSelect" aria-label="Selecionar câmera">
<option value="">Detectando câmeras...</option>
</select>
<button id="startBtn">ATIVAR CÂMERA</button>
</div>

<section class="result" id="result">
<div class="ok" id="authorizationStatus"></div>
<div class="result-label">CREDENCIAL IDENTIFICADA</div>
<div class="code" id="resultCode"></div>
<div class="result-label" id="wordLabel">PALAVRA DA CREDENCIAL</div>
<div class="word" id="resultWord"></div>
<div class="keyword" id="keywordLabel" style="display:none">PALAVRA-CHAVE</div>
<div class="small" id="authorizationMessage"></div>
<button class="again" id="againBtn">ESCANEAR NOVAMENTE</button>
</section>

<section class="evidence-log" id="evidenceLog">
<div class="log-title">REGISTRO DE EVIDÊNCIAS</div>
<div class="log-list" id="logList"></div>
</section>

<div class="footer"><span>OPERAÇÃO NEXUS</span><span class="counter">EVIDÊNCIAS REGISTRADAS // 0/11</span></div>
</main>

<script>
window.addEventListener("load", async () => {

const statusTitle=document.getElementById("statusTitle");
const statusText=document.getElementById("statusText");
const startBtn=document.getElementById("startBtn");
const againBtn=document.getElementById("againBtn");
const cameraSelect=document.getElementById("cameraSelect");
const result=document.getElementById("result");
const resultCode=document.getElementById("resultCode");
const authorizationStatus=document.getElementById("authorizationStatus");
const authorizationMessage=document.getElementById("authorizationMessage");
const resultWord=document.getElementById("resultWord");
const keywordLabel=document.getElementById("keywordLabel");
const evidenceLog=document.getElementById("evidenceLog");
const logList=document.getElementById("logList");
const counter=document.querySelector(".counter");

/* ÚNICOS QR CODES AUTORIZADOS */
const AUTHORIZED_CODES=[
"NEXUS-ALFA-07",
"NEXUS-NEXUS-04"
];

/* UMA PALAVRA POR CREDENCIAL — 11 PALAVRAS POR EQUIPE */
const CREDENTIAL_WORDS={
"NEXUS-ALFA-01":"CRIAR",
"NEXUS-ALFA-02":"EVIDÊNCIAS",
"NEXUS-ALFA-03":"JUNTOS",
"NEXUS-ALFA-04":"INVESTIGAR",
"NEXUS-ALFA-05":"É",
"NEXUS-ALFA-06":"COM",
"NEXUS-ALFA-07":"ANALISAR",
"NEXUS-ALFA-08":"ATENÇÃO",
"NEXUS-ALFA-09":"DECIDIR",
"NEXUS-ALFA-10":"CONECTAR",
"NEXUS-ALFA-11":"E",
"NEXUS-NEXUS-01":"COLABORAÇÃO",
"NEXUS-NEXUS-02":"TECNOLOGIA",
"NEXUS-NEXUS-03":"SUBSTITUI",
"NEXUS-NEXUS-04":"PENSAMENTO",
"NEXUS-NEXUS-05":"CRÍTICO",
"NEXUS-NEXUS-06":"EXIGE",
"NEXUS-NEXUS-07":"CONTEXTO",
"NEXUS-NEXUS-08":"VERIFICAÇÃO",
"NEXUS-NEXUS-09":"E",
"NEXUS-NEXUS-10":"RESPONSABILIDADE",
"NEXUS-NEXUS-11":"NÃO"
};

const scannedCodes=new Set();
let sessionTeam=null;

let scanner=null,running=false,locked=false;

function status(title,text,error=false){
statusTitle.textContent=title;
statusTitle.classList.toggle("error",error);
statusText.textContent=text;
}

async function loadCameras(){
try{
if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
throw new Error("O navegador não disponibiliza acesso à câmera.");
}
const temp=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
temp.getTracks().forEach(t=>t.stop());
const devices=await navigator.mediaDevices.enumerateDevices();
const cameras=devices.filter(d=>d.kind==="videoinput");
cameraSelect.innerHTML="";
cameras.forEach((cam,i)=>{
const opt=document.createElement("option");
opt.value=cam.deviceId;
opt.textContent=cam.label || `Câmera ${i+1}`;
cameraSelect.appendChild(opt);
});
if(!cameras.length) throw new Error("Nenhuma câmera foi encontrada.");
status("PRONTO PARA LEITURA","Selecione a câmera e pressione ATIVAR CÂMERA.");
}catch(err){
cameraSelect.innerHTML='<option value="">Câmera não detectada</option>';
status("CÂMERA NÃO DISPONÍVEL",friendlyError(err),"error");
console.error("NEXUS camera diagnostic:",err);
}
}

function friendlyError(err){
if(err && err.name==="NotAllowedError") return "O acesso à câmera foi bloqueado pelo navegador.";
if(err && err.name==="NotFoundError") return "Nenhuma câmera disponível neste dispositivo.";
if(err && err.name==="NotReadableError") return "A câmera está sendo usada por outro programa. Feche OBS, Meet, Teams ou outro app que use a webcam.";
if(err && err.name==="OverconstrainedError") return "A câmera selecionada não aceitou esta configuração. Escolha outra câmera.";
if(err && err.name==="SecurityError") return "O navegador bloqueou o acesso por segurança. Confirme que o endereço começa com HTTPS.";
return "Não foi possível iniciar a câmera. Verifique a permissão e tente novamente.";
}

async function start(){
if(running) return;

locked=false;
result.classList.remove("show");
authorizationStatus.textContent="";
authorizationMessage.textContent="";
resultWord.textContent="";
keywordLabel.style.display="none";
result.style.borderColor="rgba(71,240,177,.55)";

if(!window.Html5Qrcode){
status("ERRO DO SCANNER","A biblioteca de leitura ainda não carregou. Atualize a página.","error");
return;
}

const deviceId=cameraSelect.value;
if(!deviceId){await loadCameras();if(!cameraSelect.value)return;}

scanner=new Html5Qrcode("reader");
status("ATIVANDO CÂMERA","Iniciando vídeo...");

try{
await scanner.start(
cameraSelect.value ? {deviceId:{exact:cameraSelect.value}} : {facingMode:"user"},
{fps:10,qrbox:{width:250,height:250}},
async (decodedText)=>{
if(locked)return;

locked=true;
const code=decodedText.trim();
resultCode.textContent=code;

const isAuthorized=AUTHORIZED_CODES.includes(code);
const word=CREDENTIAL_WORDS[code] || "—";
const teamPrefix=code.startsWith("NEXUS-ALFA-") ? "ALFA" : code.startsWith("NEXUS-NEXUS-") ? "NEXUS" : null;
if(!sessionTeam && teamPrefix) sessionTeam=teamPrefix;

resultWord.textContent=word;
keywordLabel.style.display=isAuthorized ? "block" : "none";
document.getElementById("wordLabel").textContent=isAuthorized ? "PALAVRA-CHAVE" : "PALAVRA DA CREDENCIAL";

if(isAuthorized){
authorizationStatus.textContent="✓ AUTORIZADO";
authorizationStatus.style.color="var(--ok)";
authorizationMessage.textContent="Credencial reconhecida. PROTOCOLO E-07 DESBLOQUEADO.";
status("AUTORIZADO","Credencial reconhecida. Protocolo E-07 desbloqueado.");
result.style.borderColor="rgba(71,240,177,.55)";
}else{
authorizationStatus.textContent="✕ NÃO AUTORIZADO";
authorizationStatus.style.color="var(--danger)";
authorizationMessage.textContent="Esta credencial não possui acesso ao protocolo. Teste outra credencial.";
status("NÃO AUTORIZADO","Esta credencial não possui acesso ao protocolo.","error");
result.style.borderColor="rgba(255,95,125,.55)";
}

if(teamPrefix === sessionTeam && !scannedCodes.has(code)){
scannedCodes.add(code);
const item=document.createElement("div");
item.className="log-item";
const number=code.split("-").pop().padStart(2,"0");
item.innerHTML=`<span>${number}</span>${word}`;
logList.appendChild(item);
evidenceLog.classList.add("show");
const count=[...scannedCodes].filter(c=>c.startsWith(`NEXUS-${sessionTeam}-`)).length;
counter.textContent=`EVIDÊNCIAS REGISTRADAS // ${count}/11`;
}

result.classList.add("show");

try{await scanner.stop()}catch(e){}
running=false;
startBtn.disabled=false;
startBtn.textContent="ATIVAR CÂMERA";

if(navigator.vibrate)navigator.vibrate(120);
},
()=>{}
);

running=true;
startBtn.disabled=true;
startBtn.textContent="CÂMERA ATIVA";
status("AGUARDANDO LEITURA","Aponte a câmera para o QR Code.");

}catch(err){
running=false;
startBtn.disabled=false;
startBtn.textContent="TENTAR NOVAMENTE";
status("CÂMERA NÃO DISPONÍVEL",friendlyError(err),"error");
console.error("NEXUS scanner start error:",err);
}
}

async function stop(){
if(scanner && running){try{await scanner.stop()}catch(e){}}
running=false;
}

startBtn.addEventListener("click",start);
againBtn.addEventListener("click",async()=>{await stop();start();});
navigator.mediaDevices?.addEventListener?.("devicechange",loadCameras);
loadCameras();

});
</script>
</body>
</html>
